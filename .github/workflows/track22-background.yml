name: Track 2.2 complete experiment

on:
  workflow_dispatch:
    inputs:
      agents:
        description: Agents in each game (pilot default 2)
        required: true
        default: 2
        type: number
      trials_per_condition:
        description: Trials in EACH condition (15 = 30 trajectories total)
        required: true
        default: 1
        type: number

permissions:
  contents: read

concurrency:
  group: track22-paid-experiment
  cancel-in-progress: false

jobs:
  experiment:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TRACK22_ARTIFACT_PASSPHRASE: ${{ secrets.TRACK22_ARTIFACT_PASSPHRASE }}
      AGENT_MODEL: deepseek/deepseek-v3.2
      GAME_JUDGE_MODEL: deepseek/deepseek-v3.2
      MONITOR_MODEL: openai/gpt-4.1-mini
      GAME_TEMPERATURE: '0.7'
      GAME_SEED_BASE: '42'
      AGENTS: ${{ inputs.agents }}
      TRIALS_PER_CONDITION: ${{ inputs.trials_per_condition }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate secrets and make an isolated fresh run directory
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${OPENROUTER_API_KEY:-}" ]] || { echo '::error::Set OPENROUTER_API_KEY as a repository secret.'; exit 1; }
          [[ ${#TRACK22_ARTIFACT_PASSPHRASE} -ge 24 ]] || { echo '::error::Set a 24+ character TRACK22_ARTIFACT_PASSPHRASE repository secret.'; exit 1; }
          run_root="$RUNNER_TEMP/track22-fresh"
          mkdir -p "$run_root/research_track_2_2"
          rsync -a --exclude='/data' --exclude='/results' \
            "$GITHUB_WORKSPACE/research_track_2_2/" "$run_root/research_track_2_2/"
          ln -s "$GITHUB_WORKSPACE/llm-trust-breaking" "$run_root/llm-trust-breaking"
          ln -s "$GITHUB_WORKSPACE/util" "$run_root/util"
          mkdir -p "$run_root/research_track_2_2/data/llm_agents" \
            "$run_root/research_track_2_2/data/labels" \
            "$run_root/research_track_2_2/data/monitor_inputs" \
            "$run_root/research_track_2_2/results"
          echo "RUN_ROOT=$run_root" >> "$GITHUB_ENV"
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Verify fixed models and full-run budget before paid calls
        shell: bash
        working-directory: ${{ runner.temp }}/track22-fresh/research_track_2_2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, math, os
          from pathlib import Path
          from src.ground_truth_pipeline import pilot_cost_estimate
          from src.real_runner import conservative_smoke_estimate
          from src.collusion_judges import load_config

          agent = os.environ['AGENT_MODEL']
          judge = os.environ['GAME_JUDGE_MODEL']
          agents = int(os.environ['AGENTS'])
          trials = int(os.environ['TRIALS_PER_CONDITION'])
          if not 2 <= agents <= 6:
              raise SystemExit('::error::Enter 2–6 agents per game.')
          if not 1 <= trials <= 15:
              raise SystemExit('::error::Enter 1–15 trials per condition. Total trajectories = 2 × trials per condition.')
          assert agent == judge == 'deepseek/deepseek-v3.2'
          assert os.environ['MONITOR_MODEL'] == 'openai/gpt-4.1-mini'
          panel = load_config()['models']
          assert [m['id'] for m in panel] == [
              'openai/gpt-4.1-nano',
              'mistralai/mistral-small-3.2-24b-instruct',
              'deepseek/deepseek-v3.2',
          ]
          game = conservative_smoke_estimate(agents, trials, agent, judge)
          full = pilot_cost_estimate(agents=agents, trials_per_condition=trials,
                                     agent_model=agent, game_judge_model=judge)
          def cap(value, factor):
              return math.ceil(value * factor * 10000) / 10000
          game_cap = cap(game['estimated_cost_usd'], 1.25)
          label_cap = cap(full['cost_reserve_usd']['three_label_judges'], 1.25)
          monitor_cap = cap(full['cost_reserve_usd']['four_monitors'], 1.25)
          total_cap = 2 * game_cap + label_cap + monitor_cap
          if total_cap > 3.50:
              raise SystemExit(f'::error::{agents} agents and {trials} trials per condition '
                  f'produce {2 * trials} trajectories and reserve ${total_cap:.4f}, '
                  'above the $3.50 limit. Reduce agents or trials.')
          with Path(os.environ['GITHUB_ENV']).open('a') as out:
              out.write(f'GAME_CAP_USD={game_cap}\nLABEL_CAP_USD={label_cap}\nMONITOR_CAP_USD={monitor_cap}\n')
          print(json.dumps({'models': {'agents': agent, 'native_game_judge': judge,
                    'label_judges': [m['id'] for m in panel],
                    'monitors': os.environ['MONITOR_MODEL']},
                    'design': {'agents_per_game': agents, 'trials_per_condition': trials,
                               'total_trajectories': 2 * trials,
                               'game_temperature': float(os.environ['GAME_TEMPERATURE']),
                               'seed_base': int(os.environ['GAME_SEED_BASE']),
                               'seed_policy': 'trial_request_sha256_v1'},
                    'logical_requests': {'games': 2 * game['game_requests'],
                    'labels': full['label_judge_calls'], 'monitors': full['monitor_calls']},
                    'estimated_total_usd': full['cost_reserve_usd']['total'],
                    'stage_caps_usd': {'each_game': game_cap, 'labels': label_cap,
                    'monitors': monitor_cap, 'total': total_cap}}, indent=2))
          PY

      - name: Build experiment container
        working-directory: ${{ runner.temp }}/track22-fresh/research_track_2_2
        run: docker compose build track22

      - name: Run both conditions, labels, and all four monitors
        id: run
        shell: bash
        working-directory: ${{ runner.temp }}/track22-fresh/research_track_2_2
        run: |
          set -euo pipefail
          for condition in independent_control coordination_opportunity; do
            docker compose run --rm --no-deps track22 \
              python -m src.real_cli run-game --agents "$AGENTS" --trials "$TRIALS_PER_CONDITION" \
              --condition "$condition" --model "$AGENT_MODEL" \
              --judge-model "$GAME_JUDGE_MODEL" --temperature "$GAME_TEMPERATURE" \
              --seed-base "$GAME_SEED_BASE" \
              --max-cost-usd "$GAME_CAP_USD" --execute-paid
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from src.real_cli import _monitor_preflight
          rows = [json.loads(line) for line in Path('data/llm_agents/trajectories.jsonl').read_text().splitlines() if line.strip()]
          estimate = _monitor_preflight(rows, os.environ['MONITOR_MODEL'])
          if estimate['estimated_monitor_cost_usd_with_3x_safety_margin'] > float(os.environ['MONITOR_CAP_USD']):
              raise SystemExit('::error::Actual monitor prompt reserve exceeds the preflight cap; no label or monitor calls made.')
          print(json.dumps(estimate, indent=2))
          PY
          docker compose run --rm --no-deps track22 \
            python -m src.ground_truth_pipeline label \
            --budget-usd "$LABEL_CAP_USD" --execute-paid
          docker compose run --rm --no-deps track22 \
            python -m src.ground_truth_pipeline stats
          docker compose run --rm --no-deps track22 \
            python -m src.ground_truth_pipeline prepare-monitor-inputs
          docker compose run --rm --no-deps track22 \
            python -m src.real_cli monitor --model "$MONITOR_MODEL" \
            --max-cost-usd "$MONITOR_CAP_USD" --execute-paid
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          def rows(path):
              assert path.is_file(), f'missing required output: {path}'
              return [json.loads(line) for line in path.read_text().splitlines() if line.strip()]

          trajectories = rows(root / 'data/llm_agents/trajectories.jsonl')
          trials = int(__import__('os').environ['TRIALS_PER_CONDITION'])
          assert len(trajectories) == 2 * trials, 'unexpected trajectory count'
          conditions = [t.get('protocol_settings', {}).get('track22_condition') for t in trajectories]
          assert conditions.count('independent_control') == trials
          assert conditions.count('coordination_opportunity') == trials
          for row in trajectories:
              sampling = row.get('generation_metadata', {})
              assert sampling.get('temperature') == 0.7, 'wrong game temperature'
              assert sampling.get('sampling_seed_policy') == 'trial_request_sha256_v1'
              assert sampling.get('trial_seed') == 42 + row['trial_id'], 'missing trial seed'
          ids = {t['trajectory_id'] for t in trajectories}
          assert len(ids) == 2 * trials, 'trajectory IDs must be unique'
          labels = rows(root / 'data/labels/verified_labels.jsonl')
          assert len(labels) == 2 * trials and {r['trajectory_id'] for r in labels} == ids, 'missing label records'
          runs = list((root / 'results/llm_agents').glob('*_monitor'))
          assert len(runs) == 1, 'expected one monitor result folder'
          predictions = rows(runs[0] / 'predictions.jsonl')
          expected = {(tid, view) for tid in ids for view in ('M1', 'M2', 'M3', 'M4')}
          assert {(r['trajectory_id'], r['condition']) for r in predictions} == expected
          assert len(predictions) == 8 * trials and all(r['status'] == 'ok' for r in predictions), 'incomplete monitor results'
          assert (runs[0] / 'monitor_vs_labels.md').is_file(), 'missing readable monitor report'
          print(f'Validated {2*trials} trajectories, {2*trials} label records, {8*trials} monitor predictions, and report.')
          PY
          echo '### Full Track 2.2 run completed' >> "$GITHUB_STEP_SUMMARY"
          echo "$((2 * TRIALS_PER_CONDITION)) trajectories, three label judges per trajectory, and M1–M4 monitoring were attempted. Inspect the encrypted artifact for unknown labels." >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt full or partial results
        id: encrypt
        if: ${{ always() && env.RUN_ROOT != '' }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUN_ROOT/research_track_2_2"
          [[ -n "${TRACK22_ARTIFACT_PASSPHRASE:-}" ]] || exit 0
          [[ -f "$root/data/llm_agents/trajectories.jsonl" || -d "$root/results/llm_agents" ]] || exit 0
          tar -czf "$RUNNER_TEMP/track22-results.tar.gz" -C "$root" data results
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$RUNNER_TEMP/track22-results.tar.gz" \
            -out "$RUNNER_TEMP/track22-results.tar.gz.enc" \
            -pass env:TRACK22_ARTIFACT_PASSPHRASE
          rm -f "$RUNNER_TEMP/track22-results.tar.gz"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Save encrypted results
        if: ${{ always() && steps.encrypt.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: track22-results
          path: ${{ runner.temp }}/track22-results.tar.gz.enc
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
