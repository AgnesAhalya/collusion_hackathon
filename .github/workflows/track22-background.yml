name: Track 2.2 background experiment

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Paid stage to run (one stage per approval)
        required: true
        type: choice
        options:
          - independent_control
          - coordination_opportunity
          - labels
          - monitors
      source_run_id:
        description: Previous stage's Actions run ID; leave empty for independent_control
        required: false
        type: string
      agent_model:
        description: Game agent model
        required: true
        default: deepseek/deepseek-v3.2
        type: string
      game_judge_model:
        description: Native game judge model
        required: true
        default: deepseek/deepseek-v3.2
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: track22-paid-experiment
  cancel-in-progress: false

jobs:
  run-stage:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STAGE: ${{ inputs.stage }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      AGENT_MODEL: ${{ inputs.agent_model }}
      GAME_JUDGE_MODEL: ${{ inputs.game_judge_model }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TRACK22_ARTIFACT_PASSPHRASE: ${{ secrets.TRACK22_ARTIFACT_PASSPHRASE }}
    steps:
      - name: Check out the experiment code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate manual approval and secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${OPENROUTER_API_KEY:-}" ]] || { echo '::error::Set the OPENROUTER_API_KEY repository secret.'; exit 1; }
          [[ ${#TRACK22_ARTIFACT_PASSPHRASE} -ge 24 ]] || { echo '::error::Set a 24+ character TRACK22_ARTIFACT_PASSPHRASE repository secret.'; exit 1; }
          if [[ "$STAGE" == independent_control ]]; then
            [[ -z "$SOURCE_RUN_ID" ]] || { echo '::error::The first stage must not have a source run ID.'; exit 1; }
          else
            [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo '::error::Enter the previous stage Actions run ID.'; exit 1; }
          fi
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
          mkdir -p research_track_2_2/data/labels research_track_2_2/data/monitor_inputs research_track_2_2/results

      - name: Download previous encrypted results
        if: ${{ inputs.stage != 'independent_control' }}
        uses: actions/download-artifact@v4
        with:
          name: track22-state
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/track22-input

      - name: Restore previous results
        if: ${{ inputs.stage != 'independent_control' }}
        shell: bash
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/track22-input/track22-state.tar.gz.enc" \
            -out "$RUNNER_TEMP/track22-state.tar.gz" \
            -pass env:TRACK22_ARTIFACT_PASSPHRASE
          tar -xzf "$RUNNER_TEMP/track22-state.tar.gz" -C research_track_2_2 --no-same-owner
          rm -f "$RUNNER_TEMP/track22-state.tar.gz"

      - name: Verify stage order and saved trajectories
        id: verify_state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('research_track_2_2')
          stage = os.environ['STAGE']
          marker = root / '.track22_workflow_state.json'
          trajectories = root / 'data/llm_agents/trajectories.jsonl'
          expected_previous = {
              'coordination_opportunity': 'independent_control',
              'labels': 'coordination_opportunity',
              'monitors': 'labels',
          }
          if stage == 'independent_control':
              assert not marker.exists() and not trajectories.exists(), 'first stage needs a fresh checkout'
          else:
              assert marker.is_file() and trajectories.is_file(), 'previous stage state is missing'
              state = json.loads(marker.read_text())
              assert state['stage'] == expected_previous[stage], 'use the run ID from the immediately preceding stage'
              assert str(state['run_id']) == os.environ['SOURCE_RUN_ID'], 'source run ID does not match saved state'
              rows = [json.loads(line) for line in trajectories.read_text().splitlines() if line.strip()]
              conditions = [row.get('protocol_settings', {}).get('track22_condition') for row in rows]
              expected = (['independent_control'] if stage == 'coordination_opportunity'
                          else ['coordination_opportunity', 'independent_control'])
              assert sorted(conditions) == sorted(expected), 'unexpected saved trajectory count or condition'
              if stage == 'coordination_opportunity':
                  assert state['agent_model'] == os.environ['AGENT_MODEL']
                  assert state['game_judge_model'] == os.environ['GAME_JUDGE_MODEL']
              if stage == 'labels':
                  assert not (root / 'data/labels/verified_labels.jsonl').exists(), 'labels already exist'
              if stage == 'monitors':
                  assert (root / 'data/labels/verified_labels.jsonl').is_file(), 'verified label file is missing'
                  assert not list((root / 'results').glob('llm_agents/*_monitor')), 'monitor results already exist'
          print(f'Validated {stage} stage input without model calls.')
          PY

      - name: Build experiment container
        shell: bash
        working-directory: research_track_2_2
        run: docker compose build track22

      - name: Run the selected paid stage
        shell: bash
        working-directory: research_track_2_2
        run: |
          set -euo pipefail
          case "$STAGE" in
            independent_control|coordination_opportunity)
              docker compose run --rm --no-deps track22 \
                python -m src.real_cli preflight --agents 2 --trials 1 \
                --model "$AGENT_MODEL" --judge-model "$GAME_JUDGE_MODEL"
              docker compose run --rm --no-deps track22 \
                python -m src.real_cli run-game --agents 2 --trials 1 \
                --condition "$STAGE" --model "$AGENT_MODEL" \
                --judge-model "$GAME_JUDGE_MODEL" --temperature 0 \
                --max-cost-usd 0.05 --execute-paid
              ;;
            labels)
              docker compose run --rm --no-deps track22 \
                python -m src.ground_truth_pipeline label --budget-usd 0.02
              docker compose run --rm --no-deps track22 \
                python -m src.ground_truth_pipeline label --budget-usd 0.02 --execute-paid
              ;;
            monitors)
              docker compose run --rm --no-deps track22 \
                python -m src.real_cli monitor --model openai/gpt-4.1-mini
              docker compose run --rm --no-deps track22 \
                python -m src.real_cli monitor --model openai/gpt-4.1-mini \
                --max-cost-usd 0.05 --execute-paid
              ;;
          esac

      - name: Mark completed stage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          marker = Path('research_track_2_2/.track22_workflow_state.json')
          marker.write_text(json.dumps({
              'stage': os.environ['STAGE'],
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'source_run_id': os.environ['SOURCE_RUN_ID'],
              'agent_model': os.environ['AGENT_MODEL'],
              'game_judge_model': os.environ['GAME_JUDGE_MODEL'],
              'code_revision': os.environ['GITHUB_SHA'],
          }, indent=2) + '\n')
          PY
          echo "### Track 2.2: $STAGE completed" >> "$GITHUB_STEP_SUMMARY"
          echo "For the next stage, enter source run ID **$GITHUB_RUN_ID**." >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt saved results, including partial results on failure
        id: encrypt
        if: ${{ always() && steps.verify_state.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${TRACK22_ARTIFACT_PASSPHRASE:-}" ]] || exit 0
          root=research_track_2_2
          [[ -f "$root/data/llm_agents/trajectories.jsonl" || -d "$root/results/llm_agents" ]] || exit 0
          paths=(data results)
          [[ ! -f "$root/.track22_workflow_state.json" ]] || paths+=(.track22_workflow_state.json)
          tar -czf "$RUNNER_TEMP/track22-state.tar.gz" -C "$root" "${paths[@]}"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$RUNNER_TEMP/track22-state.tar.gz" \
            -out "$RUNNER_TEMP/track22-state.tar.gz.enc" \
            -pass env:TRACK22_ARTIFACT_PASSPHRASE
          rm -f "$RUNNER_TEMP/track22-state.tar.gz"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Save encrypted research artifact
        if: ${{ always() && steps.encrypt.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: track22-state
          path: ${{ runner.temp }}/track22-state.tar.gz.enc
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
